<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>MenuKu — Menu Digital</title>
<meta name="theme-color" content="#1f3a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf6ef; --cream2:#f4ecdc; --paper:#fffdf8;
  --gold:#c9a55c; --gold-d:#a88a3e; --gold-l:#e8d4a0;
  --green:#1f3a2e; --green2:#2d5440; --green-l:#3d6650;
  --t:#1a1814; --m:#6b6055; --m2:#a89e92;
  --or:#d44a1a; --ok:#5a8c3a; --er:#b03a2e; --wa:#c9802a;
  --line:#e8dfcc; --line2:#d4c9b0;
  --sh:0 1px 8px rgba(60,40,15,.04); --sh-md:0 4px 16px rgba(60,40,15,.08); --sh-lg:0 12px 36px rgba(60,40,15,.14);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--cream);color:var(--t);-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:96px;overscroll-behavior-y:none}
input,select,textarea,button{font:inherit;color:inherit;border:0;background:0}
button{cursor:pointer}
[hidden]{display:none!important}
img{display:block;max-width:100%}
::selection{background:var(--gold);color:var(--green)}

/* === HERO === */
.hero{position:relative;color:var(--paper);padding:max(28px,env(safe-area-inset-top)) 24px 32px;background:linear-gradient(135deg,var(--green) 0%,var(--green2) 55%,#15281f 100%);overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(201,165,92,.18) 0,transparent 45%),radial-gradient(circle at 15% 95%,rgba(201,165,92,.08) 0,transparent 40%);pointer-events:none}
.hero::after{content:'';position:absolute;left:24px;right:24px;bottom:14px;height:1px;background:linear-gradient(to right,transparent,rgba(201,165,92,.4),transparent)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;position:relative;z-index:1}
.hero-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero-status .dot{width:8px;height:8px;border-radius:50%;background:#7fd496;box-shadow:0 0 0 3px rgba(127,212,150,.2);animation:pulse 2.5s infinite}
.hero-status.off .dot{background:#f4c430;box-shadow:0 0 0 3px rgba(244,196,48,.2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.hero-actions{display:flex;gap:8px}
.hero-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(201,165,92,.18);border:1px solid rgba(201,165,92,.35);color:var(--gold-l);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.02em;transition:.2s}
.hero-btn:active{transform:scale(.95)}
.hero-btn svg{width:13px;height:13px}
.hero-main{position:relative;z-index:1;text-align:center}
.hero-logo{width:64px;height:64px;margin:0 auto 14px;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--green);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:700;box-shadow:0 8px 24px rgba(201,165,92,.4);border:2px solid rgba(255,255,255,.1)}
.hero h1{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin-bottom:4px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hero-sub{font-size:12.5px;opacity:.78;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.hero-sub span{display:inline-flex;align-items:center;gap:4px}
.hero-sub svg{width:12px;height:12px;opacity:.7}
.hero-meja{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,rgba(201,165,92,.22),rgba(201,165,92,.1));border:1px solid rgba(201,165,92,.4);border-radius:99px;padding:7px 16px;font-size:13px;font-weight:600;letter-spacing:.02em}
.hero-meja svg{width:14px;height:14px;color:var(--gold-l)}
.hero-meja b{font-family:var(--serif);font-size:15px;color:var(--gold-l)}

/* === SEARCH === */
.search-wrap{padding:0 20px;margin-top:-18px;position:relative;z-index:10}
.search{background:var(--paper);border-radius:14px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;padding:13px 16px;border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--gold-d);flex:none}
.search input{flex:1;font-size:15px;outline:0;min-width:0;background:transparent}
.search input::placeholder{color:var(--m2);font-style:italic}

/* === CATEGORIES === */
#cats{position:sticky;top:0;z-index:15;background:var(--cream);display:flex;gap:8px;overflow-x:auto;padding:16px 20px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cats::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:9px 18px;font-weight:600;font-size:13px;white-space:nowrap;scroll-snap-align:start;color:var(--m);transition:.2s;letter-spacing:.01em}
.chip.on{background:var(--green);border-color:var(--green);color:var(--gold-l);box-shadow:0 4px 14px rgba(31,58,46,.25)}
.chip .ico{font-size:14px}

/* === MENU LIST === */
main{padding:8px 20px 24px;max-width:760px;margin:auto}
.sec-ttl{font-family:var(--serif);font-size:22px;font-weight:700;margin:22px 2px 12px;color:var(--green);display:flex;align-items:baseline;gap:10px}
.sec-ttl small{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--m2);letter-spacing:.04em;text-transform:uppercase}
.sec-ttl::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--line2),transparent);margin-left:8px;margin-bottom:4px}

.ml{display:flex;flex-direction:column;gap:12px}
.mi{display:flex;gap:14px;background:var(--paper);border-radius:14px;padding:12px;box-shadow:var(--sh);transition:.25s;overflow:hidden;position:relative;border:1px solid var(--line)}
.mi:active{transform:scale(.99);box-shadow:var(--sh-md)}
.mi.z{opacity:.5}
.mi .ph{width:104px;height:104px;border-radius:12px;background:linear-gradient(135deg,var(--cream2),#e8dcc4);display:grid;place-items:center;font-size:36px;flex:none;overflow:hidden;position:relative}
.mi .ph img{width:100%;height:100%;object-fit:cover}
.mi .ph .emo{filter:drop-shadow(0 2px 6px rgba(60,40,15,.15))}
.mi .bd{flex:1;min-width:0;display:flex;flex-direction:column;padding:2px 0}
.mi .nm{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.25;color:var(--t);display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.mi .ds{font-size:12.5px;color:var(--m);line-height:1.5;margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
.mi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.mi .pr{font-family:var(--serif);font-weight:700;color:var(--green);font-size:17px}
.mi .pr small{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--m2);margin-right:2px;letter-spacing:.04em}
.mi .add{display:flex;align-items:center;gap:8px}
.mi .add .qty{font-weight:700;font-size:15px;min-width:22px;text-align:center;color:var(--t)}
.mi-btn{width:34px;height:34px;border-radius:10px;font-weight:700;font-size:18px;display:grid;place-items:center;transition:.15s;padding:0;user-select:none}
.mi-btn.add{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--paper);box-shadow:0 3px 10px rgba(201,165,92,.35);width:auto;padding:0 16px;font-size:13px;gap:5px;display:inline-flex;font-weight:600;letter-spacing:.02em}
.mi-btn.min{background:var(--paper);border:1.5px solid var(--line);color:var(--green)}
.mi-btn.pls{background:var(--green);color:var(--gold-l)}
.mi-btn:active{transform:scale(.88)}
.st-badge{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;background:#fbe8e4;color:var(--er);letter-spacing:.04em;text-transform:uppercase}
.featured{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--paper);font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 2px 6px rgba(201,165,92,.4)}

/* === CART BAR === */
#cart-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:linear-gradient(135deg,var(--green),var(--green2));border:1px solid rgba(201,165,92,.3);border-radius:16px;padding:14px 20px;box-shadow:0 12px 32px rgba(31,58,46,.4);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--paper);transform:translateY(calc(100% + 30px));transition:transform .3s cubic-bezier(.4,0,.2,1)}
#cart-bar.show{transform:none}
#cart-bar .info{flex:1;min-width:0}
#cart-bar .info .cnt{font-size:11px;opacity:.85;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-l)}
#cart-bar .info .cnt .badge{background:var(--gold);color:var(--green);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700}
#cart-bar .info .tot{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.2}
#cart-bar .go{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--gold-l)}
#cart-bar .go svg{width:16px;height:16px}

/* === SHEET === */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,30,22,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.o{opacity:1;pointer-events:auto}
.sheet>div{background:var(--cream);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 22px max(20px,env(safe-area-inset-bottom));transform:translateY(60px);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sheet.o>div{transform:none}
.gr{width:42px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 16px}
.sheet-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:4px;color:var(--green)}
.sheet-sub{font-size:13px;color:var(--m);margin-bottom:14px}

/* === CART ITEMS === */
.ci{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border:0}
.ci .ph-mini{width:56px;height:56px;border-radius:10px;background:var(--cream2);display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.ci .ph-mini img{width:100%;height:100%;object-fit:cover}
.ci .nm{flex:1;min-width:0}
.ci .nm .ttl{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.3;color:var(--t)}
.ci .nm .pr-mini{font-size:12px;color:var(--m);margin-top:2px}
.ci .nm .note-input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;margin-top:6px;outline:0;color:var(--m)}
.ci .nm .note-input:focus{border-color:var(--gold)}
.ci .nm .note-input::placeholder{font-style:italic;color:var(--m2)}
.ci .qbtn{display:flex;align-items:center;gap:8px;margin-top:6px}
.ci .qbtn button{width:30px;height:30px;border-radius:8px;font-weight:700;font-size:16px;display:grid;place-items:center;padding:0}
.ci .qbtn .min{background:var(--paper);border:1.5px solid var(--line);color:var(--green)}
.ci .qbtn .pls{background:var(--green);color:var(--gold-l)}
.ci .qbtn .q{font-weight:700;min-width:22px;text-align:center;font-size:15px}
.ci .sub{font-family:var(--serif);font-weight:700;color:var(--green);font-size:15px;text-align:right;white-space:nowrap}

/* === SUMMARY === */
.sum{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:14px}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--m);padding:3px 0}
.sum-row.total{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green);border-top:1px dashed var(--line2);margin-top:8px;padding-top:10px}
.sum-row.total .val{color:var(--gold-d)}
.sum-note{font-size:11.5px;color:var(--m2);text-align:center;margin-top:10px;padding:10px;background:var(--cream2);border-radius:10px;border:1px dashed var(--line2)}
.sum-note b{color:var(--green)}

.btn-primary{display:block;width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--green);font-weight:700;font-size:15px;padding:15px;border-radius:14px;box-shadow:0 8px 20px rgba(201,165,92,.35);margin-top:14px;transition:.15s;letter-spacing:.02em;font-family:var(--sans)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--m);font-weight:600;padding:11px 18px;border-radius:12px;font-size:14px}
.input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;outline:0;margin-top:10px}
.input:focus{border-color:var(--gold)}

/* === STATUS CARD === */
#status-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh);margin-top:16px;border-left:3px solid var(--gold)}
.st-progress{display:flex;gap:4px;margin:8px 0 16px}
.st-step{flex:1;height:3px;border-radius:99px;background:var(--line);transition:.3s;position:relative}
.st-step.on{background:var(--gold)}
.st-step.done{background:var(--green)}
.st-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--m2);margin-bottom:14px;letter-spacing:.04em;text-transform:uppercase}
.st-labels span.on{color:var(--gold-d);font-weight:700}
.st-labels span.done{color:var(--green);font-weight:700}
.st-row{display:flex;gap:14px;align-items:flex-start}
.st-ico{font-size:32px;flex:none;line-height:1}
.st-body{flex:1;min-width:0}
.st-body .lbl{font-family:var(--serif);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--green)}
.st-body .desc{font-size:12.5px;color:var(--m);margin-top:4px;line-height:1.5;font-style:italic}
.st-body .meta{font-size:11.5px;color:var(--m2);margin-top:8px}
.st-body .meta b{color:var(--t);font-family:var(--serif)}
.st-badge2{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.03em}
.st-badge2.new{background:#fbe8e4;color:var(--or)}
.st-badge2.proc{background:#fff4e5;color:var(--wa)}
.st-badge2.done{background:#e8f0e0;color:var(--ok)}
.st-badge2.cancel{background:#fbe8e4;color:var(--er)}

/* === TOAST === */
#toast{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;color:#fff;padding:13px 22px;border-radius:14px;font-weight:600;font-size:14px;max-width:90vw;box-shadow:var(--sh-lg);text-align:center;background:var(--green);border:1px solid rgba(201,165,92,.3);opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--er)}

/* === EMPTY & ERROR === */
.empty{text-align:center;padding:50px 20px;color:var(--m)}
.empty .ico{font-size:48px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px;line-height:1.5}
.err-screen{min-height:100vh;display:grid;place-items:center;padding:30px;text-align:center;background:linear-gradient(135deg,var(--green),var(--green2))}
.err-card{background:var(--cream);border-radius:24px;padding:36px 28px;box-shadow:var(--sh-lg);max-width:380px;width:100%;border:1px solid var(--gold-l)}
.err-card .ico{font-size:56px;margin-bottom:14px}
.err-card h1{font-family:var(--serif);font-size:22px;margin-bottom:8px;color:var(--green)}
.err-card p{color:var(--m);font-size:14px;line-height:1.55;margin-bottom:18px}

/* loading */
#loading{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--green2));color:var(--paper)}
.loader{text-align:center}
.loader .spin{width:44px;height:44px;border:3px solid rgba(201,165,92,.2);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
.loader p{font-weight:600;opacity:.9;font-size:14px;letter-spacing:.02em}
.loader .brand{font-family:var(--serif);font-size:24px;color:var(--gold-l);margin-bottom:8px;font-weight:700}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:380px){
 .mi .ph{width:90px;height:90px;font-size:30px}
 .hero h1{font-size:24px}
 .sec-ttl{font-size:20px}
}
</style>
</head>
<body>

<div id="loading">
  <div class="loader">
    <div class="brand">MenuKu</div>
    <div class="spin"></div>
    <p>Menyiapkan menu…</p>
  </div>
</div>

<div id="err" class="err-screen" hidden>
  <div class="err-card">
    <div class="ico" id="err-ico">🍽</div>
    <h1 id="err-t">Menu tidak tersedia</h1>
    <p id="err-m">Periksa QR Code atau hubungi kasir.</p>
    <button class="btn-primary" style="margin-top:0" onclick="location.reload()">Coba lagi</button>
  </div>
</div>

<div id="app" hidden>
  <header class="hero">
    <div class="hero-top">
      <div class="hero-status" id="hstat"><div class="dot"></div><span id="hstat-t">Buka</span></div>
      <div class="hero-actions">
        <button class="hero-btn" onclick="callWaiter()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          Pelayan
        </button>
        <button class="hero-btn" onclick="requestBill()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M12 6h.01M9 10h6M9 14h6"/></svg>
          Bill
        </button>
      </div>
    </div>
    <div class="hero-main">
      <div class="hero-logo" id="lg">M</div>
      <h1 id="nm">—</h1>
      <div class="hero-sub" id="sub"></div>
      <div class="hero-meja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span>Meja</span> <b id="meja">?</b>
      </div>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Cari menu favorit Anda…" oninput="renderMenu()">
    </div>
  </div>

  <div id="cats"></div>

  <main>
    <div id="menu-list" class="ml"></div>
    <div id="status-card" hidden></div>
    <div id="foot" style="text-align:center;padding:24px 14px 30px;color:var(--m2);font-size:12px;line-height:1.7;letter-spacing:.02em"></div>
  </main>

  <div id="cart-bar" hidden>
    <div class="info">
      <div class="cnt"><span class="badge" id="cb-n">0</span> item dalam keranjang</div>
      <div class="tot" id="cb-t">Rp 0</div>
    </div>
    <div class="go">
      <span>Lihat pesanan</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>

<!-- MODAL CART -->
<div id="shc" class="sheet" onclick="if(event.target===this)cs()">
  <div>
    <div class="gr"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div><div class="sheet-title">Pesanan Anda</div><div class="sheet-sub">Meja <b id="sc-meja">?</b> · periksa kembali sebelum kirim</div></div>
      <button class="btn-ghost" onclick="cs()">Tutup</button>
    </div>
    <div id="cart-items"></div>
    <div id="cart-sum"></div>
    <input id="catPel" class="input" placeholder="Catatan untuk kasir / nama (opsional)">
    <button class="btn-primary" id="kirimBtn" onclick="kirim()">
      <svg style="display:inline-block;vertical-align:-3px;margin-right:6px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      Kirim pesanan ke dapur
    </button>
  </div>
</div>

<!-- MODAL STATUS -->
<div id="shs" class="sheet" onclick="if(event.target===this)cs()">
  <div style="text-align:center">
    <div class="gr"></div>
    <div id="status-content"></div>
    <button class="btn-ghost" style="margin-top:18px" onclick="cs()">Tutup</button>
  </div>
</div>

<!-- MODAL PANGGILAN -->
<div id="shcall" class="sheet" onclick="if(event.target===this)cs()">
  <div style="text-align:center">
    <div class="gr"></div>
    <div id="call-content"></div>
    <button class="btn-ghost" style="margin-top:14px" onclick="cs()">Tutup</button>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz3yedhl9M8UheDo8C3aMqyNKr-piXrghBJURh2r5Ut8QyDvymGERmWG1yHU9NcBKg/exec';
const $ = i => document.getElementById(i), R = n => 'Rp ' + Math.round(+n || 0).toLocaleString('id-ID');
const E = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const params = new URLSearchParams(location.search);
const TOK = params.get('t') || '', MEJA = +params.get('m') || 0;
let DATA = null, cart = {}, cartNotes = {}, curCat = 'Semua', lastOrd = null, lastStatus = '';

function toast(m, e) {
  const t = $('toast'); t.textContent = m;
  t.className = e ? 'err show' : 'show';
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

async function api(action, b = {}) {
  let r, t;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...b }) }); t = await r.text(); }
  catch (e) { throw new Error('Tidak ada koneksi. Periksa internet.'); }
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('Server tidak merespons. Hubungi kasir.'); }
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j;
}

function fail(title, msg, ico = '🍽') {
  $('loading').hidden = 1; $('err').hidden = 0;
  $('err-t').textContent = title; $('err-m').textContent = msg; $('err-ico').textContent = ico;
}

async function init() {
  if (!TOK) return fail('QR Code tidak valid', 'QR Code tidak berisi token toko. Pindai ulang QR Code di meja.', '⚠️');
  if (!MEJA) return fail('Meja tidak ditemukan', 'Pindai ulang QR Code yang ada di meja Anda.', '🪑');
  if (API.startsWith('GANTI')) return fail('Backend belum dikonfigurasi', 'Pemilik restoran belum mengisi URL API di menu.html. Hubungi kasir.', '🔧');
  try {
    DATA = await api('menu', { t: TOK, m: MEJA });
    if (!DATA.meja_valid) return fail('Meja tidak terdaftar', 'Meja ' + MEJA + ' belum terdaftar di restoran ini. Hubungi kasir.', '🪑');
    render();
    cekStatus();
    setInterval(cekStatus, 12000);
  } catch (e) { fail('Gagal memuat menu', e.message, '📡'); }
}

function render() {
  $('loading').hidden = 1; $('app').hidden = 0;
  $('nm').textContent = DATA.toko;
  $('lg').textContent = (DATA.toko || 'M')[0].toUpperCase();
  $('sc-meja').textContent = MEJA;
  const info = DATA.info || {};
  let sub = [];
  if (info.wbuka && info.wtutup) sub.push(`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${info.wbuka}-${info.wtutup}</span>`);
  if (info.telp) sub.push(`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg> ${info.telp}</span>`);
  $('sub').innerHTML = sub.length ? sub.join('') : (info.alamat ? `<span>${E(info.alamat)}</span>` : '');
  if (info.wbuka && info.wtutup) {
    const now = new Date(), h = String(now.getHours()).padStart(2, '0'), m = String(now.getMinutes()).padStart(2, '0');
    const cur = h + ':' + m;
    const open = cur >= info.wbuka && cur <= info.wtutup;
    if (!open) { $('hstat').classList.add('off'); $('hstat-t').textContent = 'Tutup'; }
    else $('hstat-t').textContent = 'Buka';
  }
  $('meja').textContent = MEJA;
  $('foot').innerHTML = (info.footer || 'Terima kasih atas kunjungan Anda') + '<br><br><b style="font-family:Georgia,serif;color:var(--gold-d);letter-spacing:.08em">MenuKu</b> · Menu Digital';
  const cats = ['Semua', ...new Set(DATA.menu.map(m => m.kategori || 'Makanan'))];
  const icoMap = { 'Semua': '🍴', 'Makanan': '🍽', 'Minuman': '🥤', 'Pembuka': '🥗', 'Penutup': '🍰', 'Snack': '🍟', 'Paket': '🍱' };
  $('cats').innerHTML = cats.map(c => `<button class="chip ${c === curCat ? 'on' : ''}" onclick="setCat(${JSON.stringify(c).replace(/"/g,'&quot;')})"><span class="ico">${icoMap[c] || '🍴'}</span>${E(c)}</button>`).join('');
  renderMenu();
}

function setCat(c) {
  curCat = c;
  document.querySelectorAll('#cats .chip').forEach(b => {
    const txt = b.textContent.trim();
    b.classList.toggle('on', txt === c.trim());
  });
  renderMenu();
}

function renderMenu() {
  const q = ($('q').value || '').toLowerCase();
  const list = DATA.menu.filter(m => (curCat === 'Semua' || (m.kategori || 'Makanan') === curCat) && (m.nama + ' ' + (m.deskripsi || '') + ' ' + m.kategori).toLowerCase().includes(q));
  const groups = {}; list.forEach(m => { const k = m.kategori || 'Makanan'; (groups[k] = groups[k] || []).push(m); });
  let html = '';
  if (!list.length) {
    html = `<div class="empty"><div class="ico">${q ? '🔍' : '📭'}</div><p>${q ? 'Tidak ada menu yang cocok dengan pencarian "' + E(q) + '"' : 'Menu kategori ini belum tersedia.'}</p></div>`;
  } else {
    Object.keys(groups).sort().forEach(k => {
      html += `<div class="sec-ttl">${E(k)} <small>${groups[k].length} menu</small></div>`;
      html += groups[k].map((m, idx) => {
        const qty = cart[m.id] || 0, habis = m.status === 'habis';
        const featured = idx === 0 && !q && curCat !== 'Semua';
        const ph = m.foto ? `<img src="${E(m.foto)}" alt="${E(m.nama)}" loading="lazy">` : `<span class="emo">${catEmoji(m.kategori)}</span>`;
        return `<div class="mi ${habis ? 'z' : ''}">
          ${featured ? '<div class="featured">Signature</div>' : ''}
          <div class="ph">${ph}</div>
          <div class="bd">
            <div class="nm">${E(m.nama)} ${habis ? '<span class="st-badge">Habis</span>' : ''}</div>
            ${m.deskripsi ? `<div class="ds">${E(m.deskripsi)}</div>` : '<div class="ds" style="visibility:hidden">.</div>'}
            <div class="foot">
              <div class="pr"><small>Rp</small>${(+m.harga).toLocaleString('id-ID')}</div>
              <div class="add">
                ${habis ? '' : qty > 0
                  ? `<button class="mi-btn min" onclick="chg('${m.id}',-1)">−</button><span class="qty">${qty}</span><button class="mi-btn pls" onclick="chg('${m.id}',1)">+</button>`
                  : `<button class="mi-btn add" onclick="chg('${m.id}',1)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Tambah</button>`}
              </div>
            </div>
          </div>
        </div>`;
      }).join('');
    });
  }
  $('menu-list').innerHTML = html;
}

function catEmoji(k) {
  const m = { 'Makanan': '🍽', 'Minuman': '🥤', 'Pembuka': '🥗', 'Penutup': '🍰', 'Snack': '🍟', 'Paket': '🍱' };
  return m[k] || '🍴';
}

function chg(id, d) {
  const m = DATA.menu.find(x => x.id === id); if (!m || m.status === 'habis') return;
  const n = (cart[id] || 0) + d; if (n < 0) return;
  n === 0 ? delete cart[id] : cart[id] = n;
  renderMenu(); cartBar();
}

function cartBar() {
  const ids = Object.keys(cart);
  const tot = ids.reduce((a, id) => { const m = DATA.menu.find(x => x.id === id); return a + (m ? m.harga * cart[id] : 0); }, 0);
  const cnt = ids.reduce((a, id) => a + cart[id], 0);
  if (cnt > 0) {
    $('cart-bar').hidden = 0;
    requestAnimationFrame(() => $('cart-bar').classList.add('show'));
    $('cb-n').textContent = cnt;
    $('cb-t').textContent = R(tot);
  } else {
    $('cart-bar').classList.remove('show');
    setTimeout(() => { if (!Object.keys(cart).length) $('cart-bar').hidden = 1; }, 300);
  }
}

document.getElementById('cart-bar').addEventListener('click', openCart);

function openCart() {
  const ids = Object.keys(cart);
  if (!ids.length) return toast('Keranjang masih kosong', 1);
  $('cart-items').innerHTML = ids.map(id => {
    const m = DATA.menu.find(x => x.id === id), q = cart[id];
    const ph = m.foto ? `<img src="${E(m.foto)}" alt="">` : catEmoji(m.kategori);
    return `<div class="ci">
      <div class="ph-mini">${ph}</div>
      <div class="nm">
        <div class="ttl">${E(m.nama)}</div>
        <div class="pr-mini">${R(m.harga)} / item</div>
        <input class="note-input" placeholder="Catatan khusus (mis. tanpa MSG, pedas)" oninput="cartNotes['${id}']=this.value" value="${E(cartNotes[id] || '')}">
        <div class="qbtn">
          <button class="min" onclick="chg('${id}',-1);openCart()">−</button>
          <span class="q">${q}</span>
          <button class="pls" onclick="chg('${id}',1);openCart()">+</button>
        </div>
      </div>
      <div class="sub">${R(m.harga * q)}</div>
    </div>`;
  }).join('');
  const info = DATA.info || {};
  const sub = ids.reduce((a, id) => { const m = DATA.menu.find(x => x.id === id); return a + m.harga * cart[id]; }, 0);
  const pjk = Math.round(sub * (+info.pajak || 0) / 100);
  const svc = Math.round(sub * (+info.service || 0) / 100);
  const tot = sub + pjk + svc;
  const estMin = Math.max(10, Math.min(45, ids.reduce((a, id) => a + cart[id] * 3, 0)));
  let sumHtml = `<div class="sum">
    <div class="sum-row"><span>Subtotal</span><span>${R(sub)}</span></div>
    ${pjk ? `<div class="sum-row"><span>Pajak (${info.pajak || 0}%)</span><span>${R(pjk)}</span></div>` : ''}
    ${svc ? `<div class="sum-row"><span>Biaya layanan (${info.service || 0}%)</span><span>${R(svc)}</span></div>` : ''}
    <div class="sum-row total"><span>Total</span><span class="val">${R(tot)}</span></div>
  </div>
  <div class="sum-note">⏱ Estimasi siap: <b>±${estMin} menit</b> · 💵 Bayar di kasir (tunai/QRIS)</div>`;
  $('cart-sum').innerHTML = sumHtml;
  $('shc').classList.add('o');
}

function cs() { document.querySelectorAll('.sheet').forEach(x => x.classList.remove('o')); }

async function kirim() {
  const ids = Object.keys(cart); if (!ids.length) return;
  const items = ids.map(id => ({ id, qty: cart[id], catatan: cartNotes[id] || '' }));
  const pel = $('catPel').value.trim();
  const btn = $('kirimBtn'); btn.disabled = 1; btn.textContent = 'Mengirim…';
  try {
    const j = await api('order', { t: TOK, m: MEJA, items, pel });
    cart = {}; cartNotes = {}; lastOrd = j.id; renderMenu(); cartBar();
    $('catPel').value = '';
    cs();
    showStatus(j.id, 'BARU', j.total);
    toast('Pesanan terkirim ke dapur!');
  } catch (e) {
    toast(e.message, 1);
    btn.disabled = 0; btn.textContent = 'Kirim pesanan ke dapur';
  }
}

async function cekStatus() {
  if (!lastOrd) return;
  try {
    const j = await api('orderStatus', { t: TOK, m: MEJA });
    if (j.id && j.status && j.status !== lastStatus) {
      lastStatus = j.status;
      showStatus(j.id, j.status, j.total, j.status !== 'BARU');
    }
  } catch (e) {}
}

const ST_L = {
  BARU: { l: 'Pesanan diterima', c: 'new', ico: '📝', desc: 'Pesanan Anda sudah sampai ke dapur. Mohon tunggu sebentar.' },
  DIPROSES: { l: 'Sedang diproses', c: 'proc', ico: '👨‍🍳', desc: 'Dapur sedang menyiapkan pesanan Anda dengan penuh cinta.' },
  SELESAI: { l: 'Pesanan siap', c: 'done', ico: '✅', desc: 'Pesanan Anda sudah siap! Silakan nikmati.' },
  BATAL: { l: 'Dibatalkan', c: 'cancel', ico: '❌', desc: 'Pesanan dibatalkan. Hubungi kasir bila perlu.' }
};
const ST_ORDER = ['BARU', 'DIPROSES', 'SELESAI'];

function showStatus(id, status, total, popup) {
  const s = ST_L[status] || ST_L.BARU;
  const card = $('status-card'); card.hidden = 0;
  const curIdx = ST_ORDER.indexOf(status);
  const stepsHtml = ST_ORDER.map((k, i) => `<div class="st-step ${i < curIdx ? 'done' : (i === curIdx ? 'on' : '')}"></div>`).join('');
  const labelsHtml = ST_ORDER.map((k, i) => `<span class="${i < curIdx ? 'done' : (i === curIdx ? 'on' : '')}">${ST_L[k].l.split(' ')[0]}</span>`).join('');
  card.innerHTML = `
    <div class="st-labels">${labelsHtml}</div>
    <div class="st-progress">${stepsHtml}</div>
    <div class="st-row">
      <div class="st-ico">${s.ico}</div>
      <div class="st-body">
        <div class="lbl">Status: <span class="st-badge2 ${s.c}">${s.l}</span></div>
        <div class="desc">${s.desc}</div>
        <div class="meta">No. pesanan: <b>${E(id)}</b>${total ? ' · Total <b>' + R(total) + '</b>' : ''}</div>
      </div>
    </div>`;
  if (popup) {
    $('status-content').innerHTML = `<div style="font-size:64px;margin-bottom:10px">${s.ico}</div><h2 class="sheet-title" style="font-size:24px">${s.l}</h2><p class="sheet-sub" style="margin-bottom:6px;font-style:italic">${s.desc}</p><p class="meta" style="font-size:12px;color:var(--m)">No. pesanan: <b>${E(id)}</b></p>`;
    $('shs').classList.add('o');
  }
}

function callWaiter() {
  $('call-content').innerHTML = `<div style="font-size:56px;margin-bottom:12px">🔔</div>
    <h2 class="sheet-title" style="font-size:22px">Panggil Pelayan</h2>
    <p class="sheet-sub" style="margin-bottom:14px">Meja <b>${MEJA}</b> meminta bantuan pelayan.</p>
    <button class="btn-primary" style="margin-top:0" onclick="confirmCall('pelayan')">🔔 Konfirmasi Panggilan</button>`;
  $('shcall').classList.add('o');
}
function requestBill() {
  $('call-content').innerHTML = `<div style="font-size:56px;margin-bottom:12px">🧾</div>
    <h2 class="sheet-title" style="font-size:22px">Minta Bill</h2>
    <p class="sheet-sub" style="margin-bottom:14px">Meja <b>${MEJA}</b> meminta struk pembayaran.</p>
    <button class="btn-primary" style="margin-top:0" onclick="confirmCall('bill')">🧾 Konfirmasi Minta Bill</button>`;
  $('shcall').classList.add('o');
}
function confirmCall(type) {
  cs();
  toast(type === 'bill' ? 'Permintaan bill terkirim ke kasir' : 'Pelayan akan segera datang ke meja ' + MEJA);
}

init();
</script>
</body>
</html>
