<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Digital</title>
<meta name="theme-color" content="#2a3df5">
<style>
:root{--bg:#f3f4fb;--c:#fff;--ln:#dfe2f2;--t:#0e1233;--m:#5f6688;--a:#2a3df5;--at:#e6e9ff;--y:#ffe45e;--ok:#12a36b;--er:#d8323c;--wa:#e8890c}
@media(prefers-color-scheme:dark){:root{--bg:#0b0e24;--c:#141938;--ln:#27305c;--t:#eef0ff;--m:#9aa2cf;--a:#7b88ff;--at:#1e2552}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:110px}
input,button{font:inherit;color:inherit}button{cursor:pointer;border:0;background:0}[hidden]{display:none!important}img{display:block}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--a) 40%,transparent)}
.hd{background:#2a3df5;color:#fff;padding:max(22px,env(safe-area-inset-top)) 20px 26px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.hd h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hd p{font-size:13px;opacity:.85;margin-top:4px}
.stub{background:var(--y);color:#0e1233;border-radius:6px 6px 14px 14px;padding:8px 16px;text-align:center;flex:none;border-bottom:3px dashed rgba(14,18,51,.25)}
.stub small{display:block;font-size:12px;font-weight:600}.stub b{font-size:28px;line-height:1;font-weight:900}
.op{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:8px}.op.off{background:var(--y);color:#0e1233}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--ln)}
.sr{width:100%;background:var(--c);border:1.5px solid var(--ln);border-radius:99px;padding:11px 18px;font-size:16px}
#cats{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}#cats::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--ln);background:var(--c);border-radius:99px;padding:7px 16px;font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--t);color:var(--bg);border-color:var(--t)}
main{max-width:720px;margin:auto;padding:8px 16px}
h2{font-size:18px;font-weight:800;margin:20px 0 10px;display:flex;gap:8px;align-items:baseline}h2 small{font-size:12px;color:var(--m);font-weight:600}
.mi{display:flex;gap:12px;background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.mi.z{opacity:.55}.mi .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mi .nm{font-weight:700;line-height:1.3}.mi .ds{font-size:13px;color:var(--m);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.pr{font-weight:800;color:var(--a);font-size:16px}
.ph{width:96px;height:96px;border-radius:12px;background:var(--at);display:grid;place-items:center;font-size:30px;flex:none;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.add{background:var(--a);color:#fff;border-radius:99px;padding:8px 18px;font-weight:700;font-size:14px}
.qt{display:flex;align-items:center;gap:6px}.qt b{min-width:22px;text-align:center}
.qt button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--a);color:var(--a);font-weight:800;font-size:18px;line-height:1}
.qt button.p{background:var(--a);color:#fff}
.hb{font-size:11px;font-weight:700;background:#fde1e3;color:var(--er);border-radius:6px;padding:1px 8px;margin-left:6px}
.tk{background:var(--c);border:1px solid var(--ln);border-top:5px solid var(--y);border-radius:4px 4px 14px 14px;padding:14px;margin:14px 0}
.tk.DIPROSES{border-top-color:var(--wa)}.tk.SELESAI{border-top-color:var(--ok)}.tk.BATAL{border-top-color:var(--er)}
.tk hr{border:0;border-top:2px dashed var(--ln);margin:10px 0}
.stp{display:flex;gap:4px;margin:10px 0 4px}.stp i{flex:1;height:6px;border-radius:9px;background:var(--ln)}.stp i.on{background:var(--ok)}.stp i.cur{background:var(--y)}
.stl{display:flex;justify-content:space-between;font-size:12px;color:var(--m)}
.empty{text-align:center;color:var(--m);padding:40px 10px}
#cb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:696px;margin:auto;background:var(--y);color:#0e1233;border-radius:99px;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:800;box-shadow:0 10px 28px rgba(14,18,51,.3);width:calc(100% - 24px)}
.sh{position:fixed;inset:0;z-index:60;background:rgba(8,10,35,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}.sh.o{opacity:1;pointer-events:auto}
.sh>div{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 20px max(20px,env(safe-area-inset-bottom))}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.ci .f{flex:1;min-width:0}
.ni{width:100%;margin-top:6px;background:var(--c);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font-size:13px}
.sum{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;color:var(--m);font-size:14px}.sum .tot{color:var(--t);font-weight:800;font-size:18px;border-top:2px dashed var(--ln);margin-top:8px;padding-top:8px}
.in{width:100%;background:var(--c);border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:16px;margin-top:12px}
.go{display:block;width:100%;background:var(--a);color:#fff;border-radius:99px;padding:14px;font-weight:800;font-size:16px;margin-top:12px}.go:disabled{opacity:.5}
.gh{border:1.5px solid var(--ln);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--a)}
#toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;max-width:90vw;background:var(--ok);box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.scr{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:var(--a);color:#fff}
.scr>div{background:var(--c);color:var(--t);border-radius:20px;padding:28px 24px;max-width:360px;width:100%}
.scr p{color:var(--m);margin:8px 0 16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="ld" class="scr"><div><b style="font-size:20px">Menyiapkan menu…</b></div></div>
<div id="er" class="scr" hidden><div><div style="font-size:44px">🍽</div><h1 id="et" style="font-size:20px;margin-top:6px"></h1><p id="em"></p><button class="go" onclick="location.reload()">Coba lagi</button></div></div>

<div id="app" hidden>
 <header class="hd"><div><h1 id="nm"></h1><p id="sub"></p><span class="op" id="op"></span></div><div class="stub"><small>Meja</small><b id="mj"></b></div></header>
 <div class="bar"><input id="q" class="sr" type="search" placeholder="Cari menu…" oninput="render()"><div id="cats"></div></div>
 <main><div id="st" hidden></div><div id="ml"></div><p id="ft" class="empty" style="font-size:12px"></p></main>
 <button id="cb" hidden onclick="openCart()"><span id="cn"></span><span id="ct"></span></button>
</div>

<div id="sh" class="sh" onclick="if(event.target===this)cs()"><div>
 <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:20px">Pesanan meja <span id="sm"></span></b><button class="gh" onclick="cs()">Tutup</button></div>
 <div id="ci"></div><div id="cs"></div>
 <input id="pel" class="in" placeholder="Nama atau No. WA (opsional)" maxlength="40">
 <button id="kb" class="go" onclick="kirim()">Kirim pesanan</button>
</div></div>
<div id="toast" hidden></div>

<script>
const API='https://script.google.com/macros/s/AKfycbz3yedhl9M8UheDo8C3aMqyNKr-piXrghBJURh2r5Ut8QyDvymGERmWG1yHU9NcBKg/exec';
const $=i=>document.getElementById(i),R=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const P=new URLSearchParams(location.search),TOK=P.get('t')||'',MEJA=+P.get('m')||0,KEY='mk_'+TOK+'_'+MEJA;
let D=null,cart={},notes={},cat='Semua',cats=[],lst=null,hid='';
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');cart=s.cart||{};notes=s.notes||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify({cart,notes}))}catch(e){}};
function toast(m,e){const t=$('toast');t.textContent=m;t.style.background=e?'#d8323c':'#12a36b';t.hidden=0;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=1,3000)}
async function api(action,b={}){
 let r,t;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...b})});t=await r.text()}catch(e){throw new Error('Tidak ada koneksi. Periksa internet Anda.')}
 let j;try{j=JSON.parse(t)}catch(e){throw new Error('Server tidak merespons. Hubungi kasir.')}
 if(!j.ok)throw new Error(j.error||'Terjadi kesalahan');return j}
function fail(t,m){$('ld').hidden=1;$('er').hidden=0;$('et').textContent=t;$('em').textContent=m}
async function init(){
 if(!TOK)return fail('QR Code tidak valid','Pindai ulang QR Code di meja Anda.');
 if(!MEJA)return fail('Meja tidak ditemukan','Pindai ulang QR Code yang ada di meja Anda.');
 try{D=await api('menu',{t:TOK,m:MEJA});
  if(!D.meja_valid)return fail('Meja tidak terdaftar','Meja '+MEJA+' belum terdaftar di restoran ini. Hubungi kasir.');
  prune(1);head();render();bar();poll();
  setInterval(poll,10000);setInterval(refresh,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();poll()}});
 }catch(e){fail('Gagal memuat menu',e.message)}}
/* jam buka, termasuk yang lewat tengah malam */
function isOpen(){const i=D.info||{};if(!i.wbuka||!i.wtutup)return true;const f=s=>{const p=String(s).split(':');return(+p[0]||0)*60+(+p[1]||0)},a=f(i.wbuka),b=f(i.wtutup),n=new Date(),c=n.getHours()*60+n.getMinutes();return a===b||(a<b?c>=a&&c<=b:c>=a||c<=b)}
function head(){
 $('ld').hidden=1;$('app').hidden=0;const i=D.info||{};document.title=D.toko+' · Menu';
 $('nm').textContent=D.toko;$('mj').textContent=MEJA;$('sm').textContent=MEJA;
 $('sub').textContent=[i.wbuka&&i.wtutup?i.wbuka+'–'+i.wtutup:'',i.alamat].filter(Boolean).join(' · ');
 const o=isOpen();$('op').textContent=o?'Buka sekarang':'Sedang tutup';$('op').className='op'+(o?'':' off');
 $('ft').innerHTML=E(i.footer||'')+(i.telp?`<br><a href="tel:${E(String(i.telp).replace(/[^\d+]/g,''))}" style="color:var(--a);font-weight:700">Hubungi restoran: ${E(i.telp)}</a>`:'')}
/* buang item keranjang yang sudah habis / dihapus */
function prune(quiet){let n=0;Object.keys(cart).forEach(id=>{const m=D.menu.find(x=>x.id===id);if(!m||m.status==='habis'){delete cart[id];delete notes[id];n++}});if(n){sv();if(!quiet)toast(n+' menu dihapus dari keranjang karena habis',1)}}
async function refresh(){try{D=await api('menu',{t:TOK,m:MEJA});prune();head();render();bar();if($('sh').classList.contains('o'))openCart()}catch(e){}}
function render(){
 const q=($('q').value||'').toLowerCase();cats=['Semua',...new Set(D.menu.map(m=>m.kategori||'Makanan'))];if(!cats.includes(cat))cat='Semua';
 $('cats').innerHTML=cats.length>2?cats.map((c,i)=>`<button class="chip ${c===cat?'on':''}" onclick="cat=cats[${i}];render()">${E(c)}</button>`).join(''):'';
 const L=D.menu.filter(m=>(cat==='Semua'||(m.kategori||'Makanan')===cat)&&(m.nama+' '+(m.deskripsi||'')+' '+m.kategori).toLowerCase().includes(q)),G={};
 L.forEach(m=>(G[m.kategori||'Makanan']=G[m.kategori||'Makanan']||[]).push(m));
 $('ml').innerHTML=L.length?Object.keys(G).sort().map(k=>`<h2>${E(k)}<small>${G[k].length} menu</small></h2>`+G[k].map(m=>{
  const n=cart[m.id]||0,z=m.status==='habis';
  return `<div class="mi ${z?'z':''}"><div class="bd"><div class="nm">${E(m.nama)}${z?'<span class="hb">Habis</span>':''}</div>${m.deskripsi?`<div class="ds">${E(m.deskripsi)}</div>`:''}
  <div class="ft"><span class="pr">${R(m.harga)}</span>${z?'':n?`<span class="qt"><button onclick="chg('${m.id}',-1)" aria-label="Kurangi">−</button><b>${n}</b><button class="p" onclick="chg('${m.id}',1)" aria-label="Tambah">+</button></span>`:`<button class="add" onclick="chg('${m.id}',1)">Tambah</button>`}</div></div>
  <div class="ph">${m.foto?`<img src="${E(m.foto)}" alt="${E(m.nama)}" loading="lazy">`:'🍽'}</div></div>`}).join('')).join('')
 :`<div class="empty">${q?'Tidak ada menu yang cocok dengan "'+E(q)+'".':'Menu belum tersedia.'}</div>`}
function chg(id,d){const m=D.menu.find(x=>x.id===id);if(!m||m.status==='habis')return;const n=Math.min(99,(cart[id]||0)+d);if(n<=0){delete cart[id];delete notes[id]}else cart[id]=n;sv();render();bar();if($('sh').classList.contains('o'))openCart()}
function calc(){const i=D.info||{},ids=Object.keys(cart),sub=ids.reduce((a,id)=>{const m=D.menu.find(x=>x.id===id);return a+(m?m.harga*cart[id]:0)},0),pjk=Math.round(sub*(+i.pajak||0)/100),svc=Math.round(sub*(+i.service||0)/100);return{sub,pjk,svc,tot:sub+pjk+svc,n:ids.reduce((a,id)=>a+cart[id],0)}}
function bar(){const c=calc();$('cb').hidden=!c.n;$('cn').textContent=c.n+' item · Lihat pesanan';$('ct').textContent=R(c.tot)}
function openCart(){
 const ids=Object.keys(cart);if(!ids.length){cs();return}const c=calc(),i=D.info||{};
 $('ci').innerHTML=ids.map(id=>{const m=D.menu.find(x=>x.id===id);return `<div class="ci"><div class="f"><b>${E(m.nama)}</b><div class="s" style="font-size:13px;color:var(--m)">${R(m.harga)}</div>
  <input class="ni" maxlength="100" placeholder="Catatan (mis. tanpa pedas)" value="${E(notes[id]||'')}" oninput="notes['${id}']=this.value;sv()">
  <span class="qt" style="margin-top:8px"><button onclick="chg('${id}',-1)" aria-label="Kurangi">−</button><b>${cart[id]}</b><button class="p" onclick="chg('${id}',1)" aria-label="Tambah">+</button></span></div><b>${R(m.harga*cart[id])}</b></div>`}).join('');
 $('cs').innerHTML=`<div class="sum"><div><span>Subtotal</span><span>${R(c.sub)}</span></div>${c.pjk?`<div><span>Pajak ${i.pajak}%</span><span>${R(c.pjk)}</span></div>`:''}${c.svc?`<div><span>Biaya layanan ${i.service}%</span><span>${R(c.svc)}</span></div>`:''}<div class="tot"><span>Total</span><span>${R(c.tot)}</span></div></div><p style="font-size:12px;color:var(--m);margin-top:8px">Pembayaran dilakukan di kasir.</p>`;
 $('sh').classList.add('o')}
function cs(){$('sh').classList.remove('o')}
addEventListener('keydown',e=>{if(e.key==='Escape')cs()});
async function kirim(){
 const ids=Object.keys(cart);if(!ids.length)return;
 if(!isOpen()&&!confirm('Restoran sedang tutup. Tetap kirim pesanan?'))return;
 const b=$('kb');b.disabled=1;b.textContent='Mengirim…';
 try{const j=await api('order',{t:TOK,m:MEJA,pel:$('pel').value.trim(),items:ids.map(id=>({id,nama:(D.menu.find(x=>x.id===id)||{}).nama,qty:cart[id],catatan:notes[id]||''}))});
  cart={};notes={};sv();$('pel').value='';cs();render();bar();lst='BARU';hid='';showSt({id:j.id,status:'BARU',total:j.total});toast('Pesanan terkirim ke dapur');scrollTo({top:0,behavior:'smooth'});
 }catch(e){toast(e.message,1);if(/tidak tersedia/i.test(e.message))refresh()}
 finally{b.disabled=0;b.textContent='Kirim pesanan'}}
/* status pesanan */
const SL={BARU:['Pesanan diterima','Pesanan Anda sudah sampai ke dapur.'],DIPROSES:['Sedang diproses','Dapur sedang menyiapkan pesanan Anda.'],SELESAI:['Pesanan siap','Silakan nikmati pesanan Anda.'],BATAL:['Dibatalkan','Hubungi kasir bila perlu.']},SO=['BARU','DIPROSES','SELESAI'];
async function poll(){try{const j=await api('orderStatus',{t:TOK,m:MEJA});if(!j.id||!j.status){$('st').hidden=1;return}
 const ch=lst!==null&&lst!==j.status;lst=j.status;showSt(j);
 if(ch){toast((SL[j.status]||[j.status])[0]);try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}}}catch(e){}}
function showSt(j){
 if(hid===j.id+j.status)return;const s=SL[j.status]||SL.BARU,k=SO.indexOf(j.status),el=$('st');el.hidden=0;
 el.innerHTML=`<div class="tk ${j.status}"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">${s[0]}</b>${j.status==='SELESAI'||j.status==='BATAL'?`<button class="gh" onclick="hid='${E(j.id+j.status)}';$('st').hidden=1">Sembunyikan</button>`:''}</div>
 <div style="color:var(--m);font-size:14px">${s[1]}</div>${k>=0?`<div class="stp">${SO.map((x,i)=>`<i class="${i<k?'on':i===k?(k===2?'on':'cur'):''}"></i>`).join('')}</div><div class="stl"><span>Diterima</span><span>Diproses</span><span>Siap</span></div>`:''}
 <hr><div style="font-size:13px;color:var(--m)">No. pesanan <b style="color:var(--t)">${E(j.id)}</b>${j.total?' · Total <b style="color:var(--t)">'+R(j.total)+'</b>':''}</div></div>`}
init();
</script>
</body>
</html>
