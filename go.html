<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MenuKu — Buka Menu</title>
<meta name="theme-color" content="#1f3a2e">
<style>
:root{--cream:#faf6ef;--gold:#c9a55c;--green:#1f3a2e;--green2:#2d5440;--t:#1a1a1a;--m:#7a6f64;--er:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1f3a2e 0%,#2d5440 60%,#15281f 100%);min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;color:#fff;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(201,165,92,.12) 0,transparent 50%),radial-gradient(circle at 80% 80%,rgba(201,165,92,.08) 0,transparent 40%);pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 18px;background:linear-gradient(135deg,#c9a55c,#a88a3e);color:#1f3a2e;border-radius:18px;display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;font-size:36px;font-weight:700;box-shadow:0 12px 32px rgba(201,165,92,.35)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.sub{font-size:14px;opacity:.8;margin-bottom:28px;line-height:1.5}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(201,165,92,.25);border-radius:18px;padding:24px 22px;margin-bottom:16px}
.spin{width:40px;height:40px;border:3px solid rgba(201,165,92,.2);border-top-color:#c9a55c;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.card .msg{font-size:14px;line-height:1.5;color:rgba(255,255,255,.9)}
.card .msg b{color:#c9a55c}
.err .ico{font-size:48px;margin-bottom:10px}
.err h2{font-family:Georgia,serif;font-size:20px;margin-bottom:8px}
.err p{font-size:13px;opacity:.85;line-height:1.5;margin-bottom:16px}
.input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(201,165,92,.3);border-radius:12px;padding:14px 16px;font-size:16px;color:#fff;outline:0;text-align:center;letter-spacing:.05em;text-transform:lowercase;margin-bottom:10px}
.input::placeholder{color:rgba(255,255,255,.4)}
.input:focus{border-color:#c9a55c;background:rgba(255,255,255,.15)}
.btn{display:block;width:100%;background:linear-gradient(135deg,#c9a55c,#a88a3e);color:#1f3a2e;font-weight:700;font-size:15px;padding:14px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(201,165,92,.3);transition:.15s;letter-spacing:.02em}
.btn:active{transform:scale(.98)}
.hint{font-size:11px;opacity:.6;margin-top:14px;line-height:1.5}
.hint b{color:#c9a55c}
.foot{margin-top:24px;font-size:11px;opacity:.5;letter-spacing:.05em}
.foot b{font-family:Georgia,serif;color:#c9a55c}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">M</div>
  <h1>MenuKu</h1>
  <p class="sub">Menu Digital Restoran</p>

  <div id="loading" class="card">
    <div class="spin"></div>
    <div class="msg" id="load-msg">Membuka menu…</div>
  </div>

  <div id="err" class="card err" hidden>
    <div class="ico">🍽</div>
    <h2 id="err-t">Menu tidak ditemukan</h2>
    <p id="err-m">Periksa kembali link atau ketik kode restoran Anda di bawah.</p>
    <input id="manual" class="input" placeholder="kode-restoran-meja" autocapitalize="off" spellcheck="false">
    <button class="btn" onclick="manualGo()">Buka Menu</button>
    <div class="hint">Format: <b>kode</b> + nomor meja. Contoh: <b>berkah1</b> untuk restoran "berkah" meja 1.</div>
  </div>

  <div class="foot">Powered by <b>MenuKu</b></div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz3yedhl9M8UheDo8C3aMqyNKr-piXrghBJURh2r5Ut8QyDvymGERmWG1yHU9NcBKg/exec';
const $ = i => document.getElementById(i);

async function api(action, b = {}) {
  let r, t;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...b }) }); t = await r.text(); }
  catch (e) { throw new Error('Tidak ada koneksi internet'); }
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('Server tidak merespons'); }
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j;
}

// Baca hash: #berkah1 → slug="berkah", meja=1
function parseHash() {
  let h = location.hash.replace(/^#/, '').trim().toLowerCase();
  if (!h) return { slug: '', meja: 0 };
  // Pisahkan slug (huruf) dari nomor meja (angka di akhir)
  const m = h.match(/^([a-z]+)(\d+)$/);
  if (m) return { slug: m[1], meja: +m[2] };
  return { slug: h.replace(/[^a-z]/g, ''), meja: 0 };
}

function menuURL(pub, meja) {
  let base = location.href.split('?')[0].split('#')[0];
  base = base.replace(/\/go\.html.*$/i, '/');
  if (!base.endsWith('/')) base += '/';
  return `${base}menu.html?t=${pub}&m=${meja}`;
}

async function go() {
  if (API.startsWith('GANTI')) {
    showErr('Backend belum dikonfigurasi', 'Pemilik restoran belum mengisi URL API. Hubungi kasir.');
    return;
  }
  const { slug, meja } = parseHash();
  if (!slug) {
    showErr('Kode restoran kosong', 'Buka link dari QR Code di meja Anda, atau ketik kode restoran + nomor meja di bawah.');
    return;
  }
  if (!meja) {
    showErr('Nomor meja tidak ditemukan', 'Link harus berisi nomor meja. Format: kode-restoran + nomor-meja, contoh: "berkah1".');
    return;
  }
  $('load-msg').innerHTML = `Mencari restoran <b>${slug}</b>, meja ${meja}…`;
  try {
    const j = await api('findBySlug', { slug });
    $('load-msg').innerHTML = `Ditemukan: <b>${j.nama}</b>. Mengarahkan ke menu…`;
    setTimeout(() => location.replace(menuURL(j.pub, meja)), 600);
  } catch (e) {
    showErr('Restoran tidak ditemukan', e.message + ' Periksa kembali kode, atau ketik manual di bawah.');
  }
}

function showErr(title, msg) {
  $('loading').hidden = 1;
  $('err').hidden = 0;
  $('err-t').textContent = title;
  $('err-m').textContent = msg;
}

function manualGo() {
  const val = $('manual').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!val) return;
  location.hash = '#' + val;
  $('loading').hidden = 0;
  $('err').hidden = 1;
  $('load-msg').textContent = 'Membuka menu…';
  go();
}

$('manual').addEventListener('keydown', e => { if (e.key === 'Enter') manualGo(); });

go();
</script>
</body>
</html>
